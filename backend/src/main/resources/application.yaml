server:
  port: 8080

spring:
  application:
    name: occupi
  profiles:
    active: dev
  docker:
    compose:
      enabled: false
  # No form-login / default in-memory user — auth is delegated to Keycloak (prod).
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/occupi}
    username: ${POSTGRES_USER:occupi}
    password: ${POSTGRES_PASSWORD:occupi}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

influxdb:
  url: http://localhost:8181
  database: occupi
  token: ""

# "Latest per room / per sensor" reads are served from InfluxDB's in-memory last
# value cache (#294); latest-lookback-days doubles as that cache's TTL. While the
# cache is cold right after an InfluxDB restart, a scan bounded to
# latest-fallback-days fills the gap — kept short because a wider scan pinned the
# single-core server CPU (#273) and now exceeds InfluxDB's parquet file limit at
# roughly four days' worth of files. history-max-days clamps how far back the
# metrics history endpoint may reach, for the same reason.
occupancy:
  latest-lookback-days: 7
  latest-fallback-days: 2
metrics:
  latest-lookback-days: 7
  latest-fallback-days: 2
  history-max-days: 7

# Caches for the room-detail reads (history / forecast / week-pattern). These results
# are identical for every viewer of a room and change slowly, so a short-lived cache
# keeps repeated and concurrent requests off the CPU-capped InfluxDB (#280).
chart:
  cache:
    history-ttl-seconds: 60
    forecast-ttl-seconds: 600
    weekpattern-ttl-seconds: 1800
    max-entries: 2000

logging:
  level:
    com.occupi: DEBUG
